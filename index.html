<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google tag (GTM-TJMJLVW3 -> GA4 G-CFFDC2GG97) — Zero-TBT Deferred Loader -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){window.dataLayer.push(arguments);}
      window.gtag = gtag;
      gtag('js', new Date());
      window.trackLocalGuideEvent = function(eventName, params) {
        var payload = Object.assign({ page_path: window.location.pathname }, params || {});
        if (typeof window.gtag === 'function') {
          window.gtag('event', eventName, payload);
        } else {
          window.dataLayer.push(Object.assign({ event: eventName }, payload));
        }
      };
      (function() {
        var loaded = false;
        function loadTag() {
          if (loaded) return;
          loaded = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-TJMJLVW3';
          document.head.appendChild(s);
        }
        ['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(function(ev) {
          window.addEventListener(ev, loadTag, { once: true, passive: true });
        });
        window.addEventListener('load', function() {
          setTimeout(loadTag, 3200);
        });
      })();
    </script>

    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!--SEO_HEAD-->
    <title>The Local Guide MS | Mississippi Food &amp; Travel Reviews</title>
    <meta name="description" content="Join Damein &amp; Mary (@TheLocalGuide-MS) for honest, self-paid Mississippi restaurant reviews, BBQ &amp; catfish picks, interactive food maps, and road trips." />
    <link rel="canonical" href="https://thelocalguidems.com/" />

    <!-- Preload Hero LCP Banner -->
    <link rel="preload" as="image" href="/assets/channel_banner.webp" type="image/webp" fetchpriority="high" />

    <!-- Non-Blocking Google Fonts: Bebas Neue, Outfit, Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    </noscript>
  </head>
  <body class="bg-zinc-950 text-zinc-100 font-sans antialiased selection:bg-amber-500 selection:text-zinc-950 overflow-x-hidden min-h-screen">
    <!-- Hidden Netlify Forms static registration blueprint (kept outside #root so Netlify CDN never mutates React SSR DOM) -->
    <form name="suggest-spot" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="suggest-spot" />
      <input type="hidden" name="subject" />
      <input name="bot-field" />
      <input name="submissionType" />
      <input name="category" />
      <input name="spotName" />
      <input name="city" />
      <input name="mustTryDish" />
      <textarea name="notes"></textarea>
      <input name="submitterName" />
      <input name="submitterEmail" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
